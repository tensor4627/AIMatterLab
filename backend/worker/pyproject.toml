[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpusampling-worker"
version = "0.13.0"
requires-python = ">=3.9"
description = "Durable WSL scientific job service for AIMatterLab"

[project.scripts]
gpusampling-worker = "studio_worker.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_worker*"]

[tool.setuptools.package-data]
studio_worker = ["engine_contracts.json", "pygas-editor-hints.json", "tool_package.schema.json"]
