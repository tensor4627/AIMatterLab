[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpusampling-worker"
version = "0.8.0"
requires-python = ">=3.10"
description = "Durable WSL scientific job service for GPU Sampling Studio"

[project.scripts]
gpusampling-worker = "studio_worker.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_worker*"]
