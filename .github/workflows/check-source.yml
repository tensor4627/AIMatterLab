name: Check source

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v?[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  check-version-skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check contracts, developer kit, links and bundled guidance
        run: |
          node scripts/sync-tool-contracts.mjs --check
          python3 scripts/package-developer-kit.py --check
          python3 -m unittest backend.worker.tests.test_contracts_and_protocol_suite.NativeNEB.test_bundled_native_input_example_matches_the_worker_contract
          node scripts/check-doc-links.mjs
          node scripts/check-bundled-guidance.mjs --source
          node --test tests/agent/scientific-context.test.mjs tests/agent/scientific-skill-router.test.mjs tests/agent/skill-context.test.mjs tests/agent/harness-guidance.test.mjs tests/contracts/engine-enum-consistency.test.mjs tests/integration/tool-source-discovery.test.mjs
